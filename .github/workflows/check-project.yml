name: Check Mina Student AI source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check views.js
          node --check xlsx-reader.js
          node --check sw.js
      - name: Validate project files and security guardrails
        run: node scripts/check-release.mjs
      - name: Test UTF-8 CSV reader
        run: node scripts/test-csv-reader.mjs
